# Uso local (MacBook) e base para a VPS.
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dohko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dohko}
      POSTGRES_DB: dohko
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # só acessível da própria máquina
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dohko"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dohko:${POSTGRES_PASSWORD:-dohko}@db:5432/dohko
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
